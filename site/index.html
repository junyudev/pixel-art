<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Bench — a pixel-art benchmark and the pixel-art skill</title>
<meta name="description" content="A pixel-art benchmark: agents redraw real Eastward sprites from a short brief, judged blind against the originals. Plus the pixel-art skill: npx skills add junyudev/pixel-art">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
  // Language: ?lang=zh|en in the URL, then a choice made with the toggle in this tab, then the visitor's system.
  // Chinese when Chinese is among the preferred languages and either outranks English or the system is set to a
  // Chinese-speaking region (e.g. en-CN: English interface, region China), otherwise English. The toggle is not
  // remembered across visits, so a new visit always follows the system.
  (() => {
    const pick = (v) => (v === "zh" || v === "en" ? v : null);
    const tags = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])
      .map((tag) => { try { return new Intl.Locale(tag); } catch { return null; } }).filter(Boolean);
    const zh = tags.findIndex((l) => l.language === "zh"), en = tags.findIndex((l) => l.language === "en");
    // a region written on a non-Chinese tag is the system region; zh tags carry their own region
    const chineseRegion = tags.some((l) => l.language !== "zh" && ["CN", "TW", "HK", "MO"].includes(l.region));
    const system = zh >= 0 && (en < 0 || zh < en || chineseRegion) ? "zh" : "en";
    localStorage.removeItem("lang");  // older builds remembered the toggle forever
    document.documentElement.lang = pick(new URLSearchParams(location.search).get("lang")) || pick(sessionStorage.getItem("lang")) || system;
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><img src="favicon-32.png" width="32" height="32" alt="">Pixel Bench</a>
  <nav class="main" id="nav"></nav>
  <div class="tools">
    <a class="iconbtn" href="https://github.com/junyudev/pixel-art" aria-label="GitHub">GitHub</a>
    <a class="btn sm primary" href="#/skill" data-t="getSkill"></a>
    <button class="iconbtn" id="lang" aria-label="Language"></button>
    <button class="iconbtn" id="theme" aria-label="Theme"></button>
  </div>
</div></header>
<main id="main" class="wrap"></main>
<footer><div class="wrap cols" id="foot"></div></footer>
<div id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
